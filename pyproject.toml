[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-engineering-deep-dive"
version = "0.1.0"
description = "Offline-first lessons for reliable, multi-tenant AI data pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alex Vervloet" }]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["ai_data*"]
