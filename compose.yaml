# Bumping the image tag doesn't upgrade a database that already exists: the volume
# keeps the vector extension at the version it was created with. After a bump, run
# once: docker compose exec postgres psql -U ai_data -d ai_data -c "ALTER EXTENSION vector UPDATE"
# or start clean with `docker compose down -v`.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_DB: ai_data
      POSTGRES_USER: ai_data
      POSTGRES_PASSWORD: ai_data_local_only
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_data -d ai_data"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ai_data_pg18:/var/lib/postgresql

volumes:
  ai_data_pg18:
